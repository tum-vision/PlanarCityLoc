# Alias of the paper inTraj grid (2187/2187 hyps). Prefer uavd4l_inTraj.yaml.

name: uavd4l_inTraj_slow
profile: compact_slow

cv_grid:
  large:
    range_xyz_deg: {x: 40.0, y: 40.0, z: 10.0, yaw_deg: 20.0}
    samples_xyz_deg: {x: 9, y: 9, z: 3, yaw_deg: 9}
  small:
    # 4D stage-2 refine (x,y,z,yaw). Rotation prior-noise ablations: --perturb_gt_r --all_6D on stage-1.
    range_xyz_deg: {x: 10.0, y: 10.0, z: 10.0, yaw_deg: 5.0, pitch_deg: 0.0, roll_deg: 0.0}
    samples_xyz_deg: {x: 9, y: 9, z: 9, yaw_deg: 3, pitch_deg: 1, roll_deg: 1}

moge:
  mode: sam3_moge2
  enc_res: 640

render:
  h: 480
  w: 640

cv:
  mask_size: [301, 224]
  batch_size: 512

pnp:
  n_ab_iters: 5

particle_filter:
  stages:
    - name: medium
      mask_size: [224, 304]
      sigma_trans: 8.0
      sigma_yaw_deg: 5.0
      n_iter: 15
      n_beams: 4
      n_candidates: 60
      gamma: 0.2
    - name: fine
      mask_size: [336, 456]
      sigma_trans: 2.0
      sigma_yaw_deg: 2.0
      n_iter: 6
      n_beams: 2
      n_candidates: 52
      gamma: 0.3
