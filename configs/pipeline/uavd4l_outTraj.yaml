# Paper UAVD4L outTraj profile: stage1 9×9×9×9 = 6561 hyps.
# Fast variant: uavd4l_outTraj_fast.yaml

name: uavd4l_outTraj
profile: wide

render:
  h: 480
  w: 640

moge:
  mode: sam3_moge2
  enc_res: 640

cv:
  mask_size: [301, 224]
  batch_size: 512

cv_grid:
  large:
    range_xyz_deg: {x: 40.0, y: 40.0, z: 60.0, yaw_deg: 20.0}
    samples_xyz_deg: {x: 9, y: 9, z: 9, yaw_deg: 9}
  small:
    range_xyz_deg: {x: 15.0, y: 15.0, z: 20.0, yaw_deg: 8.0}
    samples_xyz_deg: {x: 9, y: 9, z: 9, yaw_deg: 5}

pnp:
  n_ab_iters: 5
