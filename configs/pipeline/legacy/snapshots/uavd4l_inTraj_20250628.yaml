# Snapshot before stage-2 pitch/roll CV fix (reproducibility).
# Use: --config legacy/uavd4l_inTraj_stage2_6dof.yaml as override on top of default profile.

name: uavd4l_inTraj
profile: compact

cv_grid:
  large:
    range_xyz_deg: {x: 40.0, y: 40.0, z: 10.0, yaw_deg: 20.0}
    samples_xyz_deg: {x: 9, y: 9, z: 3, yaw_deg: 9}
  small:
    range_xyz_deg: {x: 10.0, y: 10.0, z: 10.0, yaw_deg: 5.0, pitch_deg: 5.0, roll_deg: 5.0}
    samples_xyz_deg: {x: 9, y: 9, z: 9, yaw_deg: 3, pitch_deg: 3, roll_deg: 3}
