<svg xmlns="http://www.w3.org/2000/svg" width="490" height="475" viewBox="45 28 490 475" role="img" aria-labelledby="title desc">
  <title id="title">PlanarCityLoc animated logo</title>
  <desc id="desc">A drone hovers over a building, projecting red rays onto its roof plane.</desc>
  <defs>
    <linearGradient id="left" x2="1" y2="1">
      <stop stop-color="#51545a"/>
      <stop offset="1" stop-color="#24272c"/>
    </linearGradient>
    <linearGradient id="right" x2="1" y2="1">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#d3d6da"/>
    </linearGradient>
    <linearGradient id="roof" x2="1" y2="1">
      <stop stop-color="#ffc4b9"/>
      <stop offset="1" stop-color="#ed675d"/>
    </linearGradient>
    <linearGradient id="drone" x2="1" y2="1">
      <stop stop-color="#858a93"/>
      <stop offset="1" stop-color="#30343a"/>
    </linearGradient>
    <g id="rotor">
      <circle r="42" fill="#999da5" fill-opacity=".07" stroke="#999da5" stroke-opacity=".3"/>
      <g fill="#6f747e" stroke="#e6e8ec" stroke-width="1.6">
        <path d="M-5-3C-22-14-45-9-45-2C-45 5-19 8 0 3C22 14 45 9 45 2C45-5 19-8 5-3Z"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
      </g>
      <circle r="5.5" fill="#f3f4f6" stroke="#555b65" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- Vector faces follow the building silhouette used by the project page. -->
  <path d="M70 295 185 352 185 480 68 423Z" fill="url(#left)" stroke="#747981" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M185 352 299 315 300 422 185 480Z" fill="url(#right)" stroke="#b2b6bd" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M70 295 110 247 219 273 299 315 185 352Z" fill="#e7e8eb" stroke="#f4f5f7" stroke-width="2" stroke-linejoin="round"/>
  <path d="M117 254 217 275 290 322 200 345Z" fill="url(#roof)" stroke="#e05a50" stroke-width="2.8" stroke-linejoin="round"/>
  <g fill="#e9ebef">
    <path d="M89 329 105 337 105 368 89 360Z"/>
    <path d="M132 351 148 359 148 390 132 382Z"/>
  </g>
  <g fill="#737984">
    <path d="M209 363 230 355 230 378 209 387Z"/>
    <path d="M251 347 272 339 272 362 251 371Z"/>
    <path d="M209 404 230 395 230 419 209 429Z"/>
    <path d="M251 386 272 377 272 400 251 410Z"/>
  </g>

  <g fill="none" stroke="#e56559" stroke-width="2.5" stroke-opacity=".8">
    <path d="M354 155 117 254">
      <animate attributeName="d" values="M354 155 117 254;M374 143 117 254;M354 155 117 254;M334 167 117 254;M354 155 117 254" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    </path>
    <path d="M354 155 217 275">
      <animate attributeName="d" values="M354 155 217 275;M374 143 217 275;M354 155 217 275;M334 167 217 275;M354 155 217 275" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    </path>
    <path d="M354 155 290 322">
      <animate attributeName="d" values="M354 155 290 322;M374 143 290 322;M354 155 290 322;M334 167 290 322;M354 155 290 322" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    </path>
    <path d="M354 155 200 345">
      <animate attributeName="d" values="M354 155 200 345;M374 143 200 345;M354 155 200 345;M334 167 200 345;M354 155 200 345" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    </path>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;20 -12;0 0;-20 12;0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.25;.5;.75;1" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1"/>
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
