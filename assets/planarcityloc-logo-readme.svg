    <path d="M343 147 354 155 369 144" fill="none" stroke="#f0f1f4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="354" cy="155" r="8" fill="#ef7868" stroke="#fff3ed" stroke-width="2.5"/>
    <use href="#rotor" transform="translate(313 85) matrix(1 -.28 0 .48 0 0)"/>
    <use href="#rotor" transform="translate(289 136) matrix(1 -.28 0 .48 0 0)"/>
    <use href="#rotor" transform="translate(451 114) matrix(1 -.28 0 .48 0 0)"/>
    <use href="#rotor" transform="translate(425 167) matrix(1 -.28 0 .48 0 0)"/>
  </g>
  <g fill="#e86c5e" stroke="#fff4ee" stroke-width="2">
    <circle cx="117" cy="254" r="4"/>
    <circle cx="217" cy="275" r="4"/>
    <circle cx="290" cy="322" r="4"/>
    <circle cx="200" cy="345" r="4"/>
