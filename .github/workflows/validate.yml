name: Validate release

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install validation dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 scipy==1.15.3 pyyaml==6.0.3 pillow==12.2.0 opencv-python-headless==4.8.1.78 matplotlib==3.10.1 trimesh==5.1.0 "setuptools<81" wheel ninja
          python -m pip install git+https://github.com/NVlabs/nvdiffrast.git@abb07ca0358f3a21c3942b50c54aa1eacd329af9 --no-build-isolation
      - name: Check Python syntax
        run: python -m compileall -q pipeline.py pipeline_ablation.py datasets moge2 pose_solver scripts utils test
      - name: Run CPU regression tests
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Check YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("configs").rglob("*.yaml"):
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
          PY
      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
      - name: Validate evaluation configuration and reporting CLI
        run: |
          python -m json.tool configs/evaluation.json > /dev/null
          python -m json.tool configs/ablations.json > /dev/null
          python -m json.tool docs/benchmark_results.json > /dev/null
          python scripts/summarize_results.py --help
